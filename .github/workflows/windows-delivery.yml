name: Windows build and downloadable delivery
on:
  push:
    branches: ['codex/pets-delivery']
    paths: ['desktop/**', '.github/workflows/**', '!.github/workflows/nvda-diagnostics.yml']
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Create an owner-reviewable draft GitHub Release after successful checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: desktop/global.json
          dotnet-version: '8.0.426'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict release evidence gate
        run: python desktop/scripts/test-release-readiness.py
      - name: Install NSIS with package verification enabled
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          'C:\Program Files (x86)\NSIS' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Core checks, native build and programmatic accessibility audit
        shell: pwsh
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP/pets-build.txt"
          try { & ./desktop/scripts/build-windows.ps1 -Installer -Accessibility *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/pets-native-output.txt" }
          finally {
            Stop-Transcript
            '### Native build diagnostic tail' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content "$env:RUNNER_TEMP/pets-native-output.txt" -Tail 100 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Native UI Automation checks (report limitations without disguising failures)
        id: uia
        shell: pwsh
        run: ./desktop/scripts/Test-Accessibility.ps1 -Exe "$PWD/desktop/artifacts/win-x64/ProfessionalEarTrainingStudio.exe" -Report "$PWD/desktop/artifacts/accessibility-audit.json"
      - name: Verify real installer, portable archive and standalone startup
        shell: pwsh
        run: ./desktop/scripts/Test-WindowsPackages.ps1
      - name: Verify actual Windows Maestro installation and lossless PCM
        shell: pwsh
        run: |
          $privatePiano=Join-Path $env:RUNNER_TEMP ('PETS-private-maestro-'+[guid]::NewGuid().ToString('N'))
          dotnet run --project desktop/tests/Studio.UIAutomation -c Release --no-build -- --piano-check "$privatePiano" "$PWD/desktop/artifacts/windows-piano-check.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows piano preparation/render verification failed' }
          $manifest=Join-Path $privatePiano 'piano/maestro.studio-piano.json'
          dotnet run --project desktop/tests/Studio.Tests -c Release --no-build -- --maestro "$manifest" --report "$PWD/desktop/artifacts/windows-maestro-tests.json"
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Maestro integration tests failed' }
      - name: Real NVDA Greek focus announcements on isolated Windows runner
        timeout-minutes: 6
        shell: pwsh
        run: ./desktop/scripts/Test-Nvda.ps1
      - name: Record actual Windows checks
        shell: pwsh
        run: |
          @{ NativeWindowsBuildSucceeded=$true; WindowsPackageSmokeSucceeded=$true; WindowsPianoPreparationSucceeded=$true; NvdaAutomatedSpeechPipelineSucceeded=$true; ManualNvdaAcceptance=$false; ProgrammaticUIASucceeded=('${{ steps.uia.outcome }}' -eq 'success'); NvdaTested=$false; PhysicalAudioTested=$false; ListeningQualityTested=$false } | ConvertTo-Json | Set-Content desktop/artifacts/WINDOWS-CHECKS.json -Encoding utf8
      - name: Assemble complete source and binary delivery
        shell: pwsh
        run: |
          python -X utf8 desktop/scripts/assemble-delivery.py *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/pets-assembly.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Delivery assembly failed; see assembly diagnostic' }
      - name: Verify frozen restore and native build from the actual source ZIP
        shell: pwsh
        run: |
          ./desktop/scripts/Test-SourcePackage.ps1
          python -X utf8 desktop/scripts/assemble-delivery.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach source-package verification evidence' }
      - name: Require every automated trial-readiness check before delivery
        shell: pwsh
        run: |
          [xml]$properties=Get-Content desktop/Directory.Build.props
          $version=$properties.Project.PropertyGroup.Version
          $readiness=Get-Content "desktop/deliverables/releases/$version/READINESS.json" -Raw | ConvertFrom-Json
          if(!$readiness.ReadyForWindows11Trial){throw ('Missing mandatory automated evidence: '+($readiness.MissingAutomated -join ', '))}
      - name: Upload downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Ear-Training-Studio-Windows-Delivery
          path: desktop/deliverables/releases/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve diagnostic reports even when a required check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-check-diagnostics
          path: |
            desktop/artifacts/*.json
            desktop/artifacts/*.stderr.txt
          if-no-files-found: warn
      - name: Publish bounded build diagnostics on a separate run branch
        if: always()
        shell: pwsh
        run: |
          $target = "downloads/windows-checks/${{ github.run_id }}"
          New-Item -ItemType Directory $target -Force | Out-Null
          if (Test-Path "$env:RUNNER_TEMP/pets-build.txt") { Copy-Item "$env:RUNNER_TEMP/pets-build.txt" "$target/build.txt" }
          if (Test-Path "$env:RUNNER_TEMP/pets-native-output.txt") { Copy-Item "$env:RUNNER_TEMP/pets-native-output.txt" "$target/native-output.txt" }
          if (Test-Path "$env:RUNNER_TEMP/pets-assembly.txt") { Copy-Item "$env:RUNNER_TEMP/pets-assembly.txt" "$target/assembly.txt" }
          Get-ChildItem desktop/artifacts/*.json -ErrorAction SilentlyContinue | Copy-Item -Destination $target
          ./desktop/scripts/Publish-Diagnostics.ps1 -Target $target -Branch "codex/pets-ci-${{ github.run_id }}"

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Professional-Ear-Training-Studio-Windows-Delivery
          path: delivery
      - name: Publish verified Windows development packages to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(find delivery -name 'ProfessionalEarTrainingStudio-*-Source.zip' -printf '%f\n' | sed -E 's/^ProfessionalEarTrainingStudio-(.*)-Source.zip$/\1/' | sort -V | tail -1)
          test -n "$version"
          tag="v$version-preview.${{ github.run_number }}"
          printf '%s\n' 'Development preview, not final 1.0.0. Native Windows build, core tests and mandatory external UI Automation checks passed in this run. Actual NVDA, Windows 11 user hardware and professional listening still require acceptance. Maestro samples are installed privately by the first-run wizard and are not redistributed. See attached test reports, checksums and keyboard installation guide.' > release-notes.txt
          mapfile -d '' assets < <(find delivery -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.json' -o -name '*.md' -o -name 'SHA256SUMS.txt' \) -print0)
          test "${#assets[@]}" -gt 5
          gh release create "$tag" "${assets[@]}" --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title "Professional Ear Training Studio $version — preview ${{ github.run_number }}" --notes-file release-notes.txt
          printf '%s\n' "Release: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
